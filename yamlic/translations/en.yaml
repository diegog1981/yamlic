configuration:
  modo:
    name: Where to run the model
    description: "auto = use your own model if available, otherwise the network. locale = your own model only. rete = network only."
  usa_rete:
    name: Use the node network
    description: "If your server is slow, the answer is requested from a network node. Names, entities and texts are replaced by codes before leaving your home and restored on return."
  smistatori:
    name: Relay addresses
    description: "Servers that connect you with nodes. Leave the default unless you know better."
  nodo:
    name: Share your server (node)
    description: "Off by default. If on, your server answers other users' requests with the local model. They only see codes, never your home."
  smistatore:
    name: Act as a relay
    description: "Only for those with a server reachable from the internet (for example a VPS). Off by default."
  solo_se_libero:
    name: Work only when the server is idle
    description: "If on, the node only accepts jobs when CPU load is below the threshold below."
  carico_max:
    name: Maximum load to accept jobs
    description: "From 0.1 to 1.0. With 0.6 the node refuses jobs if the CPU is above 60%."
  diretto:
    name: Direct connection (experimental)
    description: "Connects your server straight to the node, without the relay. Both sides see each other's IP address. Leave off if unsure."
  model:
    name: Local model
    description: "0.5b is lighter, 1.5b is more accurate. Only downloaded if your server acts as a node or you do not use the network."
  context:
    name: Context length
    description: "How much text the local model can read at once. Leave 2048 unless you have problems."
  allow_create:
    name: Allow saving automations
    description: "Off by default: Yamlic shows the YAML and you copy it. If on, a button saves the automation in one click. Always review the result first."
  llm_url:
    name: Model server (optional)
    description: "Address of your own llama.cpp server, instead of the local model. Leave empty if you do not have one."
  llm_key:
    name: Model server key
    description: "Only needed if the server above requires a key."
  io_person:
    name: Your person entity (optional)
    description: "Pick your person entity, for example person.john, so that \"when I leave\" refers to you."
  scomponi:
    name: Split long requests
    description: "If you write several things each with its own trigger, Yamlic splits them into separate automations and generates them in parallel."
  voto_adattivo:
    name: Check with more nodes when the answer is doubtful
    description: "Asks one node first. If the answer is not convincing it asks more nodes and picks the most common structure."
  ripara:
    name: Repair model errors
    description: Automatically fixes non-existent services, unresolved notifications, lights swapped with the TV, rain triggers, wrong room.
  micro:
    name: "Micro-sentences"
    description: "Splits the request into parts and builds them locally with rules (Italian only)."
  mappa:
    name: Use the home map
    description: Hides technical entities and uses your corrections from "La tua casa".
  domande:
    name: Questions on unclear parts
    description: When part of the request is unclear, Yamlic asks you and offers choices.
  correzioni:
    name: "AI corrections"
    description: "If the final check finds errors, they are sent back to the model (up to 2 times) and the best answer is kept."
  ibrido:
    name: Final check with the compiler
    description: "Turns the automation into a plan, fixes non-existent entities, thresholds on the wrong sensor and actions that repeat the trigger, then rewrites clean YAML."
  grammatica:
    name: Grammar (experimental)
    description: "Forces the model to use only the listed entities and services. Off by default: needs testing."
network:
  8099/tcp: Yamlic page
  8100/tcp: Relay port (only if you enable the relay role)
