name: Build immagini Yamlic
on:
  push:
    branches: [main]
    paths: ["yamlic/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [yamlic]
    steps:
      - uses: actions/checkout@v4
      - name: Leggi versione
        id: v
        run: |
          V=$(grep '^version:' ${{ matrix.addon }}/config.yaml | sed 's/version: *//' | tr -d '"')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          push: true
          tags: |
            ghcr.io/diegog1981/${{ matrix.addon }}:${{ steps.v.outputs.version }}
            ghcr.io/diegog1981/${{ matrix.addon }}:latest
